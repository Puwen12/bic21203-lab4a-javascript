<!DOCTYPE html>
<html>
<body>
    <label for="userInput">Enter a number:</label>
    <input type="text" id="userInput" placeholder="Enter a number">
    <button id="checkBtn" type="button">Check</button>
    <p id="result" role="status" aria-live="polite"></p>

    <script>
        const checkButton = document.getElementById("checkBtn");
        const resultDisplay = document.getElementById("result");
        function checkInput() {
            let inputValue = document.getElementById("userInput").value.trim();
            if (inputValue === "" || isNaN(inputValue)) {
                resultDisplay.textContent = "Please enter a valid number!";
            } else {
                let numberVal = Number(inputValue);
                if (numberVal < 10) {
                resultDisplay.textContent = "The number is lower than 10";
                } else if (numberVal > 10) {
                resultDisplay.textContent = "The number is higher than 10";
                } else {
                resultDisplay.textContent = "The number is equal to 10";
                }
            }
        }
        checkButton.addEventListener("click", checkInput);
    </script>
    
</body>
</html>
